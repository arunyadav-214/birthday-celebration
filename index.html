<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Happy Birthday! 🎉</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: linear-gradient(135deg, #ffe29f, #ffa99f, #ff719a);
  }
  .card {
    width: min(92vw, 620px);
    padding: 42px 28px;
    text-align: center;
    border-radius: 28px;
    background: rgba(255,255,255,0.92);
    box-shadow: 0 18px 60px rgba(0,0,0,0.18);
    position: relative;
    z-index: 3;
  }
  h1 {
    font-size: clamp(2.4rem, 7vw, 4.7rem);
    margin: 0 0 10px;
  }
  h2 {
    margin: 0 0 18px;
    font-size: clamp(1.4rem, 4vw, 2rem);
  }
  p {
    font-size: 1.1rem;
    line-height: 1.6;
    margin: 0 auto 26px;
    max-width: 500px;
  }
  button {
    border: 0;
    border-radius: 999px;
    padding: 15px 24px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    background: #222;
    color: white;
    transition: transform .2s ease;
  }
  button:hover { transform: scale(1.05); }
  .emoji { font-size: 2rem; margin-top: 20px; }
  .balloon {
    position: fixed;
    bottom: -150px;
    width: 60px;
    height: 75px;
    border-radius: 50%;
    opacity: .85;
    animation: rise linear infinite;
  }
  .balloon::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 74px;
    width: 2px;
    height: 95px;
    background: rgba(60,60,60,.5);
  }
  @keyframes rise {
    to { transform: translateY(-125vh) rotate(8deg); }
  }
  .confetti {
    position: fixed;
    top: -20px;
    width: 10px;
    height: 18px;
    z-index: 5;
    animation: fall 3s linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0.8; }
  }
</style>
</head>
<body>

<div class="card">
  <h1>🎂 Happy Birthday! 🎉</h1>
  <h2>Wishing you an amazing day!</h2>
  <p>
    May your birthday be filled with happiness, laughter, love,
    and lots of unforgettable memories. You deserve a wonderful year ahead! ❤️
  </p>
  <button onclick="celebrate()">🎊 Click to Celebrate 🎊</button>
  <div class="emoji">🎁 🎈 🥳 🍰 🎉</div>
</div>

<script>
const colors = ["#ff4d6d","#ffd166","#06d6a0","#118ab2","#8338ec","#fb5607"];
for (let i = 0; i < 16; i++) {
  const b = document.createElement("div");
  b.className = "balloon";
  b.style.left = Math.random() * 100 + "vw";
  b.style.background = colors[Math.floor(Math.random()*colors.length)];
  b.style.animationDuration = (7 + Math.random()*6) + "s";
  b.style.animationDelay = (Math.random()*5) + "s";
  b.style.transform = `scale(${0.7 + Math.random()*0.8})`;
  document.body.appendChild(b);
}

function celebrate() {
  for (let i = 0; i < 130; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDuration = (2 + Math.random()*2.5) + "s";
    c.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4500);
  }
}
</script>
</body>
</html>
